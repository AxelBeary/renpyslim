# 依赖安全与更新监控：每周检查 Python 依赖与 Actions 版本。
# pip 只收安全更新，不收纯版本 bump（requirements.txt 用的是
# 宽容下限，Dependabot 抬下限只收紧兼容性无收益）。
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # 注意：update-types 合法值只有下面三个 semver 粒度（旧写法
      # "version-update" 不被识别，2026-10-01 实测失效放过纯 bump PR）。
      # 安全更新不属于 version-update，不受此 ignore 影响，照常推送。
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
