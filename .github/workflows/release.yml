# 打版本号标签（v0.12.0 之类）后自动构建 exe 并发布 Release。
# 发版流程：git tag v0.x.0 && git push origin v0.x.0 —— 剩下的全自动。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        # -c requirements-lock.txt：exe 构建的依赖版本（含 PyInstaller 与传递依赖）
        # 逐字冻结、可复现；ci.yml 不锁版本，继续当上游破坏性发布的 canary。
        run: pip install -c requirements-lock.txt -r requirements.txt -r requirements-dev.txt pyinstaller

      # 发布前先跑一遍回归，红了就不发版
      - name: Sanity tests
        run: python -m pytest tests -q

      - name: "Build exe (recipe: RenPySlim.spec)"
        run: python -m PyInstaller --noconfirm RenPySlim.spec

      # 若 Release 已手动建好（含发布说明），只补传 exe 不覆盖；否则照常自动创建。
      - name: Publish Release with exe attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (gh release view $tag 2>$null) {
            Write-Host "Release $tag 已存在，仅补传 exe 附件"
            gh release upload $tag dist\RenPySlim.exe --clobber
          } else {
            gh release create $tag dist\RenPySlim.exe --title $tag --generate-notes
          }
